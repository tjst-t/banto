<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案11 膳 — 画面は番頭が組む</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ideal.css">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   案11「膳」— 画面は番頭が組む。POは配置を覚えない

   ■ 直したかったこと
   案9・案10 も、案6 までの全部も、**POに置き場を覚えさせている**。
   タブ・棚・カタログ・列・紙——どれも「どこに何があるか」の記憶を要求する。
   だが D7 は逆を言っている：「POの頭は判断だけに使う。操作の記憶はシステムが持つ」。

   ■ 賭けていること
   **固定のレイアウトを持たない。** 会話が縦に1本流れ、番頭がその瞬間に要るものを
   **膳（ぜん）**——器に載せて差し出す。タブも棚もカタログも無い。

   ・膳は話に合わせて**組み替わる**。差分の話なら差分が、判断なら選択肢が載る
   ・膳は**育つ**。往復が続くと大きくなり、ある時点で番頭が
     「この膳は独立させます」と言って**枝になる**——枝が生まれる瞬間が見える
   ・独立した枝は幹の**右に寄り添う**（浮いた板）。幹は流れ続ける
   ・畳むと膳が幹に沈み、結論が1行残る
   ・POが自分で出したいときは**言う**（「差分だけ見せて」）。探さない
   ・**手元に出せるのは2つまで**（幹を入れて3頁）。頁は手元であって台帳ではない
     ——台帳は幹と横断の通知。3つ目を開くといちばん古いものを下ろす（消さない）
   ・器で描けないもの（大きい面）も**同じ頁の住人**になる。語彙を増やさない
   ・横断の通知だけは常設。これは番頭の裁量の外だから（ADR-0015）

   ■ 失うもの
   予測可能性。番頭が組み間違えると、POには直す手立てが「言う」しかない。
   一望性も無い（案9・案10 より弱い）。**番頭の判断力に全部を賭ける案**。

   署名：**膳が組み替わり、育ち、独立し、還る**。この見本は送るたびに1手進みます。
   ══════════════════════════════════════════════════════════════════════════ */

.shell { height: 100%; display: flex; flex-direction: column; padding-bottom: 26px; }

/* 常設はこの帯だけ。**膳は番頭が出すので、開くための道具立てが要らない** */
.top { flex: none; display: flex; align-items: center; gap: var(--s3); height: 52px; padding: 0 var(--s5); }
.pj-btn { display: flex; align-items: center; gap: var(--s2); height: 32px; padding: 0 var(--s3); border-radius: var(--r-sm); font-weight: 600; }
.pj-btn:hover { background: var(--surface-2); }
.pj-btn .dot { background: var(--accent); }
.pj-btn svg { width: 14px; height: 14px; fill: none; stroke: var(--text-3); stroke-width: 2; stroke-linecap: round; }
.top .lead { font-size: var(--t-xs); color: var(--text-3); }
.top .sp { flex: 1; }
.ib-btn { display: flex; align-items: center; gap: var(--s2); height: 32px; padding: 0 var(--s3); border-radius: var(--r-sm); color: var(--text-2); }
.ib-btn:hover { background: var(--surface-2); color: var(--text); }
.ib-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

.body { flex: 1; min-height: 0; display: flex; }
.stream { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--s5); }
.col { display: flex; flex-direction: column; gap: var(--s4); padding: var(--s4) 0 var(--s6); max-width: 740px; margin: 0 auto; }
.composer-wrap { flex: none; padding: var(--s2) var(--s5) var(--s4); position: relative; }
.composer-wrap::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 26px;
                         background: linear-gradient(to top, var(--bg), transparent); pointer-events: none; }
.composer-wrap .composer { max-width: 740px; margin: 0 auto; }
.hintline { max-width: 740px; margin: var(--s2) auto 0; font-size: var(--t-xs); color: var(--text-3); display: flex; gap: var(--s2); }

/* ══ 膳 ══════════════════════════════════════════════════════════════════
   番頭が差し出す器。**中身に合わせて姿が変わる**——タブも枠の型も無い    */
.zen { border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--sh-2);
       overflow: hidden; animation: rise 260ms var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.zen-head { display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4);
            border-bottom: 1px solid var(--line-2); }
.zen-head svg { width: 15px; height: 15px; fill: none; stroke: var(--accent); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.zen-head b { font-size: var(--t-md); font-weight: 650; }
.zen-head .m { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--text-3); }
.zen-head .sp { flex: 1; }
.zen-body { padding: var(--s4); }
.zen-body > * + * { margin-top: var(--s3); }
/* 膳が小さくなった姿（役目を終えて要約になったもの） */
.zen.folded .zen-body { padding: var(--s2) var(--s4); font-size: var(--t-sm); color: var(--text-2); }
/* 育っている膳 */
.zen.growing { box-shadow: var(--sh-2), 0 0 0 1px var(--accent); }
.zen-note { padding: var(--s2) var(--s4) var(--s3); font-size: var(--t-xs); color: var(--text-3); border-top: 1px solid var(--line-2); }
.zen-note b { color: var(--accent); font-weight: 600; }

.code { font-family: var(--f-mono); font-size: var(--t-sm); line-height: 1.75; white-space: pre; overflow-x: auto;
        background: var(--bg); border-radius: var(--r-md); padding: var(--s3); }
.code .a { color: var(--ok); } .code .d { color: var(--stop); } .code .c { color: var(--text-3); }
.rows { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.rows .r { display: flex; align-items: center; gap: var(--s2); padding: 9px var(--s3); font-size: var(--t-sm); border-bottom: 1px solid var(--line-2); }
.rows .r:last-child { border-bottom: 0; }
.rows .r b { font-weight: 500; } .rows .r .sp { flex: 1; }
.rows .r em { font-style: normal; font-family: var(--f-mono); font-size: var(--t-xs); color: var(--text-3); }

/* 幹に残る枝の1行と、回収の1行 */
.bline { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s4); border-radius: var(--r-md);
         background: var(--surface); box-shadow: var(--sh-1); font-size: var(--t-sm); width: 100%; }
.bline:hover { box-shadow: var(--sh-2); }
.bline .t { flex: 1; min-width: 0; text-align: left; }
.bline .t b { font-weight: 600; }
.bline .m { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--text-3); }
.backline { display: flex; align-items: flex-start; gap: var(--s2); font-size: var(--t-sm); color: var(--text-2); }
.backline .k { flex: none; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%;
               box-shadow: inset 0 0 0 1.5px var(--ok); color: var(--ok); margin-top: 3px; }
.backline .k svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.backline b { color: var(--text); font-weight: 600; }

/* ══ 独立した膳＝枝。幹の右に寄り添う浮いた板 ═════════════════════════════ */
.dock { width: 0; flex: none; overflow: hidden; transition: width 260ms var(--ease); }
.body.dock-on .dock { width: min(46%, 560px); }
.dock-in { height: 100%; padding: 0 var(--s4) var(--s4) 0; display: flex; flex-direction: column; gap: var(--s2); }
.plate { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--surface);
         border-radius: var(--r-lg); box-shadow: var(--sh-3); overflow: hidden; }
.pl-head { flex: none; display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line-2); }
.pl-head .t { flex: 1; min-width: 0; }
.pl-head h2 { font-size: var(--t-md); font-weight: 650; line-height: 1.4; }
.pl-head .sub { font-size: var(--t-xs); color: var(--text-3); }
.pl-body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
.pl-say { flex: none; padding: var(--s2) var(--s3) var(--s3); }
.pl-say .composer { box-shadow: var(--sh-1); }
/* 膳は1枚ずつ「頁」に入れる。広いときは活きている1枚だけ出す */
.page { display: none; min-height: 0; }
.page.on { display: flex; flex-direction: column; flex: 1; min-height: 0; }

/* 抱えている板が複数あるときの重なり */
.plates { display: flex; flex-direction: column-reverse; gap: 6px; }
.mini { display: flex; align-items: center; gap: var(--s2); padding: 7px var(--s3); border-radius: var(--r-md);
        background: var(--surface); box-shadow: var(--sh-1); font-size: var(--t-sm); }
.mini:hover { box-shadow: var(--sh-2); }
.mini .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }

/* ══ 狭いとき：独立した膳は**隣の頁**になる ══════════════════════════════
   広い画面で板が「幹の右に寄り添う」のと同じ関係を、画面が1枚しかない環境では
   **空間の代わりに指の動き**へ写す。膳が独立した瞬間に頁が1枚増えるので、
   この案の署名（独立する瞬間）がモバイルでも消えない。
   独立していない膳は幹の中に居たまま——**独立したものだけが頁になる**。      */
.pager { display: none; align-items: center; gap: 5px; }
.pg { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-3); flex: none; transition: all var(--dur) var(--ease); }
.pg.on { background: var(--accent); width: 18px; border-radius: 4px; }
.pg.trunk.on { background: var(--text-2); }

@media (max-width: 760px) {
  .body { overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .body::-webkit-scrollbar { display: none; }
  .stream { flex: 0 0 100%; scroll-snap-align: start; }
  .body.dock-on .dock, .dock { width: auto; flex: 0 0 auto; overflow: visible; }
  .dock-in { flex-direction: row; height: 100%; padding: 0; gap: 0; }
  /* **min-width: 0 が要る。** flex の既定（min-width:auto）だと、頭の題とボタンの
     min-content 幅まで頁が太り、めくり先が画面の端に揃わなくなる（実測 466px） */
  /* `.page.on` は広い画面用に flex:1 を持つ。**メディアクエリは詳細度を上げない**ので、
     ここで同じ詳細度まで書かないと、活きている頁だけが伸びて端に揃わなくなる */
  .page, .page.on { display: flex !important; flex-direction: column; flex: 0 0 100vw; min-width: 0; min-height: 0;
          scroll-snap-align: start; padding: 0 var(--s3) var(--s3); }
  .stream { min-width: 0; }
  /* 頭は折り返す。狭いところで題とボタンを1行に押し込まない */
  .pl-head { flex-wrap: wrap; row-gap: var(--s2); }
  .pl-head .t { flex: 1 1 100%; order: -1; }
  .pl-head .btn { font-size: var(--t-xs); height: 28px; }
  .plate { border-radius: var(--r-lg); }
  .plates { display: none; }          /* 控えの板は頁が兼ねる */
  .pager { display: flex; }
  .top { padding: 0 var(--s3); gap: var(--s2); }
  .top .lead { display: none; }
  .ib-btn span:not(.count) { display: none; }
  .scroll { padding: 0 var(--s3); }
  .col { max-width: none; }
  .composer-wrap { padding: var(--s2) var(--s3) var(--s3); }
  .hintline { max-width: none; }
  .inbox { width: 100%; }
}

/* 手元から下ろしたことを知らせる。**黙って消さない**（I2） */
.toast { position: fixed; left: 50%; top: 64px; transform: translateX(-50%) translateY(-6px); z-index: 90;
         max-width: min(520px, calc(100% - 32px)); padding: 9px var(--s4); border-radius: var(--r-md);
         background: var(--text); color: var(--surface); font-size: var(--t-sm); box-shadow: var(--sh-3);
         opacity: 0; pointer-events: none; transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease); }
.toast.on { opacity: 1; transform: translateX(-50%); }

/* ── 横断の通知：常設の数字＋被さる面 ─────────────────────────────────── */
.veil { position: fixed; inset: 0; z-index: 70; display: none; background: rgba(17,22,31,.32); }
.veil.on { display: block; }
.inbox { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: min(760px, 100%); height: 100%;
         background: var(--bg); box-shadow: var(--sh-3); display: flex; flex-direction: column; }
.ib-head { flex: none; padding: var(--s6) var(--s6) var(--s3); }
.ib-head h2 { font-size: var(--t-2xl); font-weight: 650; letter-spacing: -.01em; }
.ib-head p { font-size: var(--t-sm); color: var(--text-2); margin-top: 2px; }
.ib-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--s6) var(--s6); display: flex; flex-direction: column; gap: var(--s3); }
.pick { position: absolute; left: 50%; top: 80px; transform: translateX(-50%); width: min(460px, calc(100% - 32px));
        background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-3); overflow: hidden; }
.pick h3 { padding: var(--s4) var(--s5) var(--s2); font-size: var(--t-lg); font-weight: 650; }
.pick .r { display: flex; align-items: center; gap: var(--s3); width: 100%; padding: var(--s3) var(--s5); }
.pick .r:hover { background: var(--surface-2); }
.pick .r .t { flex: 1; min-width: 0; }
.pick .r b { display: block; font-size: var(--t-md); font-weight: 600; }
.pick .r s { display: block; text-decoration: none; font-size: var(--t-xs); color: var(--text-3); }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <button class="pj-btn" id="pjBtn"><span class="dot"></span><span id="pjName">banto</span>
      <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></button>
    <span class="lead">幹・この会話は畳まれません</span>
    <span class="pager" id="pager"></span>
    <span class="sp"></span>
    <button class="ib-btn" id="inboxBtn">
      <svg viewBox="0 0 24 24"><path d="M3 13h4l2 3h6l2-3h4"/><path d="M5 5h14l2 8v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4z"/></svg>
      横断の通知 <span class="count" id="ibN">3</span></button>
    <button class="btn btn-icon btn-ghost" id="themeBtn"><svg viewBox="0 0 24 24"><path d="M20 14a8 8 0 01-10-10 8 8 0 1010 10z"/></svg></button>
  </header>

  <div class="body" id="body">
    <main class="stream">
      <div class="scroll" id="scroll"><div class="col" id="col"></div></div>
      <div class="composer-wrap">
        <div class="composer">
          <textarea id="ta" placeholder="番頭に相談する"></textarea>
          <div class="composer-tools"><span class="m">claude-opus-5</span><span class="sp"></span>
            <button class="btn btn-accent" id="send">送る</button></div>
        </div>
        <div class="hintline" id="hint"></div>
      </div>
    </main>

    <!-- 独立した膳＝枝。幹の右に寄り添う -->
    <aside class="dock"><div class="dock-in" id="dock"></div></aside>
  </div>
</div>

<div class="veil" id="veil">
  <div class="inbox" id="inboxFace">
    <div class="ib-head"><h2>横断の通知</h2>
      <p>ここだけは常設です——<b>番頭の裁量の外</b>にあるものだから（ADR-0015）。出所もプロジェクトも問わず、ここ1本。</p></div>
    <div class="ib-list" id="ibList"></div>
  </div>
  <div class="pick" id="pickFace" style="display:none"><h3>プロジェクト</h3><div id="pickList"></div></div>
</div>

<div class="toast" id="toast"></div>

<div class="stamp">案11 膳 — 画面は番頭が組む<span class="sp"></span>
  <button id="resetBtn">最初から</button><span id="step"></span></div>

<script src="scene.js"></script>
<script>
const { PROJECTS, FACES, BRANCHES, TRUNKS, LETTERS, svg, row } = window.SCENE;
const $ = (id) => document.getElementById(id);

let pj = "banto";
/* 手元に出せるものの上限。**頁は手元であって台帳ではない**——
   台帳は幹（時系列で全部ある）と横断の通知（あなたの番のもの）。
   上限が無いと、頁が右へ無限に伸びて奥のものへ行けなくなる */
const MAX_HELD = 2;
let plates = [];     // いま手元に出しているもの（枝／面）。左が古い
let active = null;

const isFace = (k) => String(k).startsWith("face:");
const keyOf  = (k) => String(k).slice(5);
const titleOf = (k) => isFace(k) ? FACES[keyOf(k)].title : BRANCHES[k].title;

/* 手元に取る。**溢れたら、いちばん古いものを下ろして知らせる**（黙って消さない） */
function hold(k) {
  if (!plates.includes(k)) plates.push(k);
  while (plates.length > MAX_HELD) {
    const dropped = plates.shift();
    toast(`「${titleOf(dropped)}」を手元から下ろしました — 幹の行と横断の通知から戻せます`);
  }
  active = k;
}
let toastT;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 3200);
}
let step = 0;        // 見本の進み。送るたびに1手

/* 膳。**器の型は無い**——載っているものに合わせて姿が決まる */
const zen = (icon, title, meta, body, note, cls = "") => `
  <div class="zen ${cls}">
    <div class="zen-head">${svg(icon)}<b>${title}</b><span class="m">${meta || ""}</span><span class="sp"></span></div>
    <div class="zen-body">${body}</div>
    ${note ? `<div class="zen-note">${note}</div>` : ""}
  </div>`;

/* 会話の中の面は**抜粋**。全部見たいときは「面で開く」で頁になる——
   器で描けないものの逃げ道がこれで、だから他の器は小さいままでいられる */
const faceZen = (k) => {
  const f = FACES[k];
  return `<div class="zen">
    <div class="zen-head">${svg(f.icon)}<b>${f.title}</b><span class="m">${f.meta}</span><span class="sp"></span>
      <button class="btn btn-ghost" data-openface="${k}">面で開く →</button></div>
    <div class="zen-body">${f.html}</div>
    <div class="zen-note">会話に出しているのは<b>抜粋</b>です。全部は面にあります。</div>
  </div>`;
};

const bline = (k) => {
  const b = BRANCHES[k];
  /* 畳んだあとも、**開いた位置には「独立させた」記録が残る**（幹は書き換わらない）。
     結論は畳んだ時点の末尾に1行積まれる——起きた順に読めるように */
  if (b.state === "merged")
    return `<button class="bline" data-plate="${k}" style="opacity:.7"><span class="dot done"></span>
      <span class="t"><b>${b.title}</b> — 膳を独立させました</span>
      <span class="m">畳みました</span><span class="badge ok">結論は下に</span></button>`;
  return `<button class="bline" data-plate="${k}"><span class="dot ${b.state}"></span>
    <span class="t"><b>${b.title}</b> — ${b.state === "turn" ? "あなたの判断を待っています" : b.state === "stop" ? "止まっています" : "私が持っています"}</span>
    <span class="m">${b.meta}</span><span class="badge accent">右に開く</span></button>`;
};

/* ── 見本の筋書き。**送るたびに膳が組み替わり、育ち、独立し、還る** ────── */
const STEPS = [
  { say: "意匠の件、差分だけ見せて",
    hint: "膳が組まれます（言えば出る。探さない）",
    add: [
      ["ba", "<p>これだけです。</p>"],
      ["zen", () => zen("diff", "views.css の差分", "+42 −18", FACES.diff.html)],
    ] },
  { say: "これ、名前を変えるかどうか決めないとね",
    hint: "同じ膳が<b>判断のための姿に組み替わります</b>",
    add: [
      ["ba", "<p>では秤を載せ替えます。差分は要約に畳んで、決め手だけ残します。</p>"],
      ["zen", () => zen("diff", "名前を変えるか", "決め手だけ",
        `<div class="rows">
          <div class="r"><span class="dot done"></span><b>変える</b><span class="sp"></span><em>体系が通る · 外向けの契約が動く</em></div>
          <div class="r"><span class="dot done"></span><b>据え置く</b><span class="sp"></span><em>互換は保たれる · 名前と中身が食い違う</em></div>
        </div>
        <div class="code"><span class="c">外向けに名指ししている先：語彙表 ＋ 3面（file.browser / git.viewer / worker.viewer）</span></div>`,
        "差分の膳を<b>畳んで組み替えました</b>。要るのは決め手であって、42行の差分ではないので。")],
    ] },
  { say: "うーん、もう少し詰めたい。影響範囲も知りたいし",
    hint: "往復が続くと、番頭が<b>膳を独立させます</b>（＝枝が生まれる瞬間）",
    add: [
      ["ba", "<p>往復が続きそうです。<strong>この膳を独立させます</strong>——幹に流し続けると、あとで読み返したときに決定が見えなくなるので。</p><p>還す条件は「方針が決まり、ADR の草案ができたら」。決まったら、結論だけ幹に沈めます。</p>"],
      ["detach", "ui"],
    ] },
  { say: "分かった。番頭が判断してよい、で進めて",
    hint: "枝を畳むと、<b>膳が幹に沈んで結論1行になります</b>",
    add: [["merge", "ui"]] },
];

let extra = [];   // 見本で足りた分（幹への追記）

function renderTrunk() {
  const base = TRUNKS[pj].map(e => row(e, {
    branch: bline,
    face: faceZen,
    back: (k) => `<div class="backline"><span class="k">${svg("check")}</span><div>枝「<b>${BRANCHES[k].title}</b>」を幹に沈めました<br><span style="color:var(--text-3)">結論：</span>${BRANCHES[k].result}</div></div>`,
  }));
  const backLine = (k) => `<div class="backline"><span class="k">${svg("check")}</span><div>膳「<b>${BRANCHES[k].title}</b>」を幹に沈めました<br><span style="color:var(--text-3)">結論：</span>${BRANCHES[k].result}</div></div>`;
  const more = extra.map(e =>
    e[0] === "zen"   ? e[1]() :
    e[0] === "bline" ? bline(e[1]) :
    row(e, { branch: bline, face: faceZen, back: backLine }));
  $("col").innerHTML = base.concat(more).join("");
  $("pjName").textContent = PROJECTS[pj].name;
  $("ta").placeholder = `番頭に相談する（${PROJECTS[pj].name}）`;
  requestAnimationFrame(() => { $("scroll").scrollTop = $("scroll").scrollHeight; });
}

/* 面の頁。**膳と同じ器に入る**——POから見れば「幹の隣に出したもの」でひと続き */
function facePageHtml(fk) {
  const f = FACES[fk];
  return `
    <div class="plate">
      <div class="pl-head">
        <span class="dot run"></span>
        <div class="t"><h2>${f.title}</h2><div class="sub">面・${f.meta}</div></div>
        <button class="btn btn-icon btn-ghost" data-shut="face:${fk}">${svg("close")}</button>
      </div>
      <div class="pl-body">${f.html}
        <p style="font-size:var(--t-xs);color:var(--text-3);line-height:1.8">
          器で描けないものは面で開きます。閉じても<b>会話には抜粋が残る</b>ので、遡れます。</p>
      </div>
    </div>`;
}

/* 膳1枚。**広くても狭くても中身は同じ**——器が頁に入るかどうかだけが違う */
function plateHtml(k) {
  if (isFace(k)) return facePageHtml(keyOf(k));
  const b = BRANCHES[k];
  return `
    <div class="plate">
      <div class="pl-head">
        <span class="dot ${b.state}"></span>
        <div class="t"><h2>${b.title}</h2><div class="sub">独立した膳・還す条件：${b.cond}</div></div>
        <button class="btn" data-merge="${k}">畳んで幹に沈める</button>
        <button class="btn btn-icon btn-ghost" data-shut="${k}">${svg("close")}</button>
      </div>
      <div class="pl-body">
        ${b.log.map(e => row(e, { face: faceZen })).join("")}
        ${b.ask ? `<div class="ask"><div class="ask-h">あなたの判断を待っています</div><p>${b.ask.text}</p>
          <div class="ask-a">${b.ask.opts.map((o, n) => `<button class="btn ${n === 0 ? "btn-turn" : n === 2 ? "btn-ghost" : ""}">${o}</button>`).join("")}</div></div>` : ""}
      </div>
      <div class="pl-say"><div class="composer">
        <textarea placeholder="この膳の中で話す" style="height:34px"></textarea>
      </div></div>
    </div>`;
}

function renderDock() {
  $("body").classList.toggle("dock-on", plates.length > 0);
  if (!plates.length) { $("dock").innerHTML = ""; renderPager(); return; }
  const k = plates.includes(active) ? active : plates[plates.length - 1];
  active = k;
  const others = plates.filter(x => x !== k);
  $("dock").innerHTML =
    plates.map(x => `<div class="page ${x === k ? "on" : ""}" data-page="${x}">${plateHtml(x)}</div>`).join("") +
    (others.length ? `<div class="plates">${others.map(x => `<button class="mini" data-plate="${x}">
        <span class="dot ${isFace(x) ? "run" : BRANCHES[x].state}"></span><span class="t">${titleOf(x)}</span></button>`).join("")}</div>` : "");
  renderPager();
}

/* 頁の位置。**幹が0頁目**——どれだけ深く入っても、左端に必ず幹が在る */
const narrow = () => window.matchMedia("(max-width: 760px)").matches;
/* 幅を計算で当てない——頁の実寸から、いちばん左端に近いものを現在地とする */
const pageEls = () => [document.querySelector(".stream"), ...document.querySelectorAll(".dock .page")].filter(Boolean);
function pageAt() {
  const left = $("body").getBoundingClientRect().left;
  let best = 0, bd = Infinity;
  pageEls().forEach((el, i) => { const d = Math.abs(el.getBoundingClientRect().left - left); if (d < bd) { bd = d; best = i; } });
  return best;
}
function renderPager() {
  const now = pageAt();
  $("pager").innerHTML = ["trunk", ...plates].map((d, i) =>
    `<button class="pg ${d === "trunk" ? "trunk" : ""} ${i === now ? "on" : ""}" data-goto-page="${i}"
       title="${d === "trunk" ? "幹" : titleOf(d)}"></button>`).join("");
}
function goPage(i) {
  if (!narrow()) return;
  requestAnimationFrame(() => {
    const el = pageEls()[i];
    el?.scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
  });
}
$("body").addEventListener("scroll", () => {
  if (!narrow()) return;
  const now = pageAt();
  const k = ["trunk", ...plates][now];
  if (k && k !== "trunk" && k !== active) { active = k; }   // めくった先が活きている膳
  renderPager();
}, { passive: true });

function renderInbox() {
  const live = LETTERS.filter(l => BRANCHES[l.to].state !== "merged");
  $("ibList").innerHTML = live.map(l => {
    const b = BRANCHES[l.to], other = b.proj !== pj;
    return `<div class="letter ${l.tone || ""}">
      <div class="lt-top"><span class="lt-from">${l.from}</span>
        <span class="badge ${l.tone === "stop" ? "stop" : "turn"}">${l.kind}</span>
        ${other ? `<span class="badge accent lt-proj">${PROJECTS[b.proj].name}</span>` : ""}
        <span class="sp"></span><span class="lt-age">${l.age}</span></div>
      <h3>${l.h}</h3>
      <dl><dt>経緯</dt><dd><q>${l.why}</q></dd><dt>起きたこと</dt><dd>${l.what}</dd><dt>枝</dt><dd>${b.title}</dd></dl>
      <div class="lt-a">${l.opts.map((o, n) => `<button class="btn ${n === 0 ? "btn-turn" : ""}">${o}</button>`).join("")}
        <span class="sp"></span>
        <button class="btn btn-ghost" data-goto="${l.to}">${svg("branch")}${other ? PROJECTS[b.proj].name + " の膳へ" : "その膳へ"}</button></div>
    </div>`;
  }).join("");
  const c = $("ibN"); c.textContent = live.length; c.classList.toggle("zero", !live.length);
}

function renderHint() {
  const s = STEPS[step];
  $("hint").innerHTML = s
    ? `<span class="badge accent">見本</span><span>送ると1手進みます：「${s.say}」 — ${s.hint}</span>`
    : `<span class="badge ok">見本</span><span>ここまでが筋書きです。「最初から」で戻せます</span>`;
  $("step").textContent = `${Math.min(step, STEPS.length)} / ${STEPS.length}`;
}

function render() { renderTrunk(); renderDock(); renderInbox(); renderHint(); }

function advance() {
  const s = STEPS[step]; if (!s) return;
  extra.push(["po", s.say]);
  for (const a of s.add) {
    if (a[0] === "detach") {
      const k = a[1];
      extra.push(["bline", k]);
      hold(k); renderDock(); goPage(plates.indexOf(k) + 1);   // 増えた頁を見せる
    } else if (a[0] === "merge") {
      const k = a[1], b = BRANCHES[k];
      b.state = "merged"; b.meta = "畳みました";
      plates = plates.filter(x => x !== k); active = null;
      extra.push(["back", k]); goPage(0);                    // 幹へ戻す
    } else extra.push(a);
  }
  step++; $("ta").value = ""; render();
}

document.addEventListener("click", (e) => {
  if (e.target.closest("#send")) return advance();
  const p = e.target.closest("[data-plate]"); if (p) {
    const k = p.dataset.plate;
    hold(k); renderDock(); return goPage(plates.indexOf(k) + 1);
  }
  const m = e.target.closest("[data-merge]"); if (m) {
    const k = m.dataset.merge, b = BRANCHES[k];
    b.state = "merged"; b.meta = "畳みました";
    plates = plates.filter(x => x !== k); active = null;
    extra.push(["back", k]); goPage(0); return render();
  }
  const s = e.target.closest("[data-shut]"); if (s) { plates = plates.filter(x => x !== s.dataset.shut); active = null; return renderDock(); }
  const g = e.target.closest("[data-goto]"); if (g) {
    $("veil").classList.remove("on");
    const k = g.dataset.goto; pj = BRANCHES[k].proj;
    hold(k); render(); goPage(plates.indexOf(k) + 1); return;
  }
  const of = e.target.closest("[data-openface]");
  if (of) { hold("face:" + of.dataset.openface); render(); return goPage(plates.indexOf("face:" + of.dataset.openface) + 1); }
  const gp = e.target.closest("[data-goto-page]"); if (gp) return goPage(+gp.dataset.gotoPage);
  const pk = e.target.closest("[data-pj]"); if (pk) {
    $("veil").classList.remove("on"); pj = pk.dataset.pj; plates = []; active = null; extra = []; step = 0; return render();
  }
  if (e.target === $("veil")) $("veil").classList.remove("on");
});
$("ta").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); advance(); } });
$("inboxBtn").addEventListener("click", () => { renderInbox(); $("inboxFace").style.display = ""; $("pickFace").style.display = "none"; $("veil").classList.add("on"); });
$("pjBtn").addEventListener("click", () => {
  $("pickList").innerHTML = Object.entries(PROJECTS).map(([k, p]) => {
    const live = Object.values(BRANCHES).filter(b => b.proj === k && b.state !== "merged");
    const turn = live.filter(b => b.state === "turn").length;
    return `<button class="r" data-pj="${k}"><span class="dot ${turn ? "turn" : "run"}"></span>
      <span class="t"><b>${p.name}</b><s>${p.note} · 枝 ${live.length}${turn ? ` · あなたの番 ${turn}` : ""}</s></span>
      ${k === pj ? '<span class="badge accent">いま見ています</span>' : ""}</button>`;
  }).join("");
  $("inboxFace").style.display = "none"; $("pickFace").style.display = ""; $("veil").classList.add("on");
});
$("themeBtn").addEventListener("click", () => {
  const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
});
$("resetBtn").addEventListener("click", () => {
  step = 0; extra = []; plates = []; active = null;
  const b = BRANCHES.ui; b.state = "turn"; b.meta = "12分";
  TRUNKS.banto = TRUNKS.banto.filter(e => !(e[0] === "back" && e[1] === "ui"));
  render();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("veil").classList.remove("on"); });

render();
</script>
</body>
</html>
