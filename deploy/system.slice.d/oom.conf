# /etc/systemd/system/system.slice.d/oom.conf として置く（unit ではなく slice の drop-in）
#
# --- OOM 封じ込め（inc-0066 / 2026-08-14）------------------------------------
# 根拠: reports/2026-08-14-oom-containment-plan.md
#       reports/2026-08-16-oom-host-facts.md
#       ※ 置き場は /home/ubuntu/banto-desk/reports/
#
# **これが無いと、子の MemoryMin は全部黙って無効になる。**
# cgroup v2 の memory.min は「親が確保している保護を、親が子へ配る」形で伝わる。
# 親（system.slice）の memory.min が 0 だと、子（banto / banto-daemon /
# banto-environment-pool）に MemoryMin=... と書いても実際には守られない——
# エラーも警告も出ないので、書いたつもりで守られていない状態になる。
#
# 値は子の合計:
#   banto.service                    1G
#   banto-daemon.service             256M
#   banto-environment-pool.service   256M
#   ------------------------------------
#                                    1536M
#
# 工房（banto-worker-pool.service）は**わざと入れていない**。守る側ではなく、
# 真っ先に回収されてよい側だから（OOMScoreAdjust=500 / MemoryMin なし）。
#
# 子の MemoryMin を増やしたら、ここも同じだけ増やすこと。
[Slice]
MemoryAccounting=yes
MemoryMin=1536M
