# banto の**検証専用**環境（Environment Pool の docker ドライバ用・`test` プロファイル）。
#
# **役割はひとつ——マージ前ゲートの検証コマンドを走らせる器**（task-0075）。人が触る面は
# 持たない（ポートを開けない・長命のサービスを起こさない）。ブラウザで触るための環境は
# `docker/dev.yaml`（`dev` プロファイル）が別に持つ——**混ぜない**（PO裁定 2026-08-11・案B）。
# 混ぜると、検証のたびに dev server が立ち上がって器の生死が検証結果に化ける。
#
# 土台のイメージ（`docker/Dockerfile.test`）は dev と共用する。道具立ての契約はそちらが真で、
# **置き場の鍵にも土台を入れてある**（下の cache）ので、土台が変われば両方が用意し直す。
#
# **Playwright のブラウザ（chromium）は土台のイメージに焼き込んである**（task-0285）——
# 検証のたびに再ダウンロードしない。置き場（BANTO_CACHE_DIR）は node_modules 専用で
# ブラウザを載せないので、ここで volume を足す必要はない。
#
# ドライバは provision で `docker compose up -d`、run で
# `docker compose run --rm <先頭サービス> sh -c <cmd>` を実行する。
#
# この機械の制約（loamium 側で先に踏んだもの）:
# - docker-default の AppArmor プロファイルをロードできないので
#   `security_opt: [apparmor=unconfined]` が要る
# - provision 後もコンテナが running を保つ必要があるので command は sleep infinity
#   **待つだけ＝起動に何も要らない**のが要点。用意（npm ci）が済んでいるかに依らずに立つので、
#   provision の順序（用意が先か後か）に関わらずこの器は壊れない。
#   ——用意を `compose up` の前に済ませる直しは task-0089 にあるが 2026-08-11 時点で未マージで、
#   本体は今も「compose up → healthcheck → setup」の順。この器はその順でも成り立つ
#   （dev は成り立たない。`docker/dev.yaml` の警告を見よ）
# - run は one-shot の sibling で動く。ソースは bind mount で共有し、node_modules は
#   別の場所に隔離してホストの作業ツリーを汚さない
#
# **node_modules の置き場は `BANTO_CACHE_DIR` で受ける**（spec-environment §5.2）。
# 名前付きボリュームだと compose がプロジェクト名（`<taskId>-docker`）を前置するので
# **タスクごとに別物**になり、毎タスク `npm ci`（実測60秒）を払い直していた。
# ドライバが鍵（package-lock.json 等の中身のハッシュ）ごとの場所を渡してくるので、
# 同じ鍵のタスクは用意済みのものを掴む。渡されないときは従来どおりタスク限りの場所。
#
# **置き場は `setup` が書くものを全部覆う**（2026-08-15）。`npm ci` の出力は
# ルートの `node_modules` だけでは終わらない——**巻き上げ（hoist）られない依存は
# `packages/<pkg>/node_modules` に書かれる**（この repo では banto-host と
# banto-worker-pool の `@anthropic-ai/*`。`package-lock.json` に
# `packages/banto-host/node_modules/...` という鍵で並んでいる）。そこが置き場に
# 載っていないと、書き先は**ワークツリー側の bind mount（`..:/app`）**になる。
# 置き場は環境より長生きするので、
#   「置き場が温まっている（`.banto-primed` が在る）＋ ワークツリーが素（node_modules 無し）」
# の組み合わせで **`npm ci` が飛ばされ、ルートだけ置き場から現れて入れ子だけが黙って欠ける**。
# 実測：素のワークツリーで `ls node_modules | wc -l` は 350 なのに
# `packages/banto-host/node_modules` は無く、テストが理由の分からない形で大量に落ちた。
# ——だから置き場を**小部屋に分けて**、`npm ci` が書く場所をひとつ残らず載せる。
# 入れ子の依存を持つ workspace が増えたら、ここに小部屋を足すこと
# （足し忘れは `tests/acceptance/env-cache-covers-nested-node-modules.spec.ts` が断る）。
#
# **git の共通ディレクトリを、ホストと同じ絶対パスで見せる**（2026-08-15）。
# リンクされたワークツリーの `.git` は**ファイル**で、中身は
# `gitdir: <本体>/.git/worktrees/<名前>`——ホストの絶対パスなので、`..:/app` しか
# 渡していない器の中では辿れず、`git ls-files` は exit 128（`fatal: not a git repository`）。
# git を呼ぶテストは**全部**これで落ちる（`tests/acceptance/source-hygiene.spec.ts` 等）。
# 同じ絶対パスに置けば `gitdir:` はそのまま辿れるので、ドライバが
# `BANTO_GIT_COMMON_DIR`（`git rev-parse --git-common-dir` の絶対パス）を渡す。
# **read-only** なのは、検証は読む仕事だから——器がリポジトリ本体の履歴を書き換えられては困る。
# 既定値（ドライバを通さず手で `docker compose` を叩いたとき）は compose ファイルの隣から
# 見た `../.git`＝リポジトリ自身の `.git`。**既に `..:/app` に入っているものの二重写し**なので、
# 新しく見せるものは無い（＝手で叩いても余計な穴が開かない）。
services:
  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    security_opt:
      - apparmor=unconfined
    working_dir: /app
    volumes:
      - ..:/app
      - ${BANTO_CACHE_DIR:-./.banto-node-modules}/root:/app/node_modules
      - ${BANTO_CACHE_DIR:-./.banto-node-modules}/pkg-banto-host:/app/packages/banto-host/node_modules
      - ${BANTO_CACHE_DIR:-./.banto-node-modules}/pkg-banto-worker-pool:/app/packages/banto-worker-pool/node_modules
      - ${BANTO_GIT_COMMON_DIR:-../.git}:${BANTO_GIT_COMMON_DIR:-/app/.git}:ro
    command: ["sleep", "infinity"]
