# banto の**検証専用**環境（Environment Pool の docker ドライバ用・`test` プロファイル）。
#
# **役割はひとつ——マージ前ゲートの検証コマンドを走らせる器**（task-0075）。人が触る面は
# 持たない（ポートを開けない・長命のサービスを起こさない）。ブラウザで触るための環境は
# `docker/dev.yaml`（`dev` プロファイル）が別に持つ——**混ぜない**（PO裁定 2026-08-11・案B）。
# 混ぜると、検証のたびに dev server が立ち上がって器の生死が検証結果に化ける。
#
# 土台のイメージ（`docker/Dockerfile.test`）は dev と共用する。道具立ての契約はそちらが真で、
# **置き場の鍵にも土台を入れてある**（下の cache）ので、土台が変われば両方が用意し直す。
#
# ドライバは provision で `docker compose up -d`、run で
# `docker compose run --rm <先頭サービス> sh -c <cmd>` を実行する。
#
# この機械の制約（loamium 側で先に踏んだもの）:
# - docker-default の AppArmor プロファイルをロードできないので
#   `security_opt: [apparmor=unconfined]` が要る
# - provision 後もコンテナが running を保つ必要があるので command は sleep infinity
#   **待つだけ＝起動に何も要らない**のが要点。用意（npm ci）は provision が `compose up` の
#   前に済ませる（task-0089）が、この器はそれに依らずに立つ。疎通（healthcheck）は用意の
#   あとに見られるので、「立ったが使えない」を ok と報告することもない
# - run は one-shot の sibling で動く。ソースは bind mount で共有し、node_modules は
#   別の場所に隔離してホストの作業ツリーを汚さない
#
# **node_modules の置き場は `BANTO_CACHE_DIR` で受ける**（spec-environment §5.2）。
# 名前付きボリュームだと compose がプロジェクト名（`<taskId>-docker`）を前置するので
# **タスクごとに別物**になり、毎タスク `npm ci`（実測60秒）を払い直していた。
# ドライバが鍵（package-lock.json 等の中身のハッシュ）ごとの場所を渡してくるので、
# 同じ鍵のタスクは用意済みのものを掴む。渡されないときは従来どおりタスク限りの場所。
services:
  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    security_opt:
      - apparmor=unconfined
    working_dir: /app
    volumes:
      - ..:/app
      - ${BANTO_CACHE_DIR:-./.banto-node-modules}:/app/node_modules
    command: ["sleep", "infinity"]
