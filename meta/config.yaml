# 層B設定（ADR-0013 決定66・67）。**このリポジトリの持ち物**で、clone すれば付いてくる。
#
# フレームワークはパス構成を知ってはいけない（決定38f）ので、判定表はここに置く。
# 書き換えは git 差分に残り、次の判定から効く（Kobo は毎回読む）。

review:
  # ここに触るタスクは**必ず PO まで上げる**（決定57）。番頭は通せない。
  # 既定は空——書かなければ `governance: true` だけが PO 直行になる。
  #
  # **2026-08-16、PO 指示により空にした**（ADR-0013 決定66 の同日追記）。
  #
  #   > 私が明示的にお願いするとき以外、banto の開発でもユーザのレビューは
  #   > 省略してくれないかな。あんまり意味ないし。
  #
  # それまでは 2026-08-06 の決定66（「banto の面＝利用体験は PO の領分」）により
  # `packages/banto-web/**`・`docs/spec/design.md`・`prototype/**` の3つが書かれていた。
  # だが実地では関所として働いていない：2026-08-16 の一日で task-0156・task-0159・
  # task-0180 が `po` に上がったが、いずれも番頭が先に差分を読んで確かめたあとの
  # 形式的な一押しで、PO が中身を見て止めたことは一度も無かった。
  #
  # **空にしても PO へ上がる道は残る**：
  #   - `governance: true` のタスクは従来どおり PO 直行（判定1）。
  #   - タスクが `review: {policy: "po"}` を名乗れば `po` のまま（判定3）。
  #     PO が「これは見せて」と言ったものはこれで上げる。
  #
  # **省いたのは「差分を見て通す」形式のレビューだけ**である。PO の判断が要る場面
  # （後戻りできない変更・データを消す・外に出る費用・方針の転換・PO が待っている
  # ものの取り下げ）は従来どおり取次へ上げる——「レビューを省く」と「PO に諮らない」
  # は別物である。
  #
  # **仕組みは残してある**：戻したくなったらここへ glob を1行書けば次の判定から
  # 効く（Kobo は毎回このファイルを読み直すので、ビルドも再起動も要らない）。
  # そのときは、この欄が空であることを機械で守る後続タスクの試験も一緒に直すこと。
  #
  # 及ぶのは **banto 自身のリポジトリだけ**。他プロジェクトの `meta/config.yaml` は
  # そのまま——あちらは PO が実際に画面を見て判断する意味がある。
  po_required_paths: []

  # **判断待ちのあいだ、PO が触るための環境**（決定59・段11c）。
  #
  # `meta/environments.yaml` の `dev`（docker / vite を 4201 で公開 / ttl 8h）。
  # これを書かないと `verify.profile`（＝ `test`）に落ちるが、`test` は
  # **人が触れる面（config.port）を持たない**ので、その場合 Kobo は環境を立てず
  # 理由を帳簿に残す——触れない環境を毎回 docker で立てても費用しか掛からない。
  env_profile: dev

  # **`review.policy` を書かなかったタスクの既定**（realign 第3便）。
  #
  # 書かなければ Kobo の既定（`DEFAULT_REVIEW_STAGE`）。**ここが後戻りの口**——
  # Kobo は毎回このファイルを読み直すので、1行足せば再起動もビルドも要らずに戻せる。
  #
  #   default_policy: banto   # 監査を通ったものを番頭が一次受けする（第3便より前の挙動）
  #   default_policy: auto    # 条件を満たすものは人を通さず着地させる（第3便の既定）
  #
  # 緩い側へ倒しても緩みは増えない：`governance: true` と上の po_required_paths、
  # および旧称 `manual` の読み替えは、いずれもこの既定より手前で効く。

limits:
  # 許す最大の等級（決定67）。超える model_tier のタスクは**積む時点で拒否**する
  # ——黙って下げると「安く速く終わった」と読まれ、要求水準を満たさない成果を受け取る。
  #
  # **監査は上限の対象外**で常に reasoning。監査は費用のつまみではなく検査だから（決定57）。
  max_model_tier: reasoning
  # 同時に動かせる職人の数。Kobo の既定（5）と比べて**厳しい方**が効く。
  max_concurrent_sessions: 5
