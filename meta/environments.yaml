# banto 自身の環境プロファイル（Environment Pool の docker ドライバ用）。
#
# **Kobo は検証をホストで走らせない**（PO裁定 2026-08-07・task-0075）。受け持たせる
# リポジトリには必ず1つ要る——banto 自身も例外ではない（自分を受け持たせるのだから）。
#
# **検証用と実行環境用は別のプロファイルにする**（PO裁定 2026-08-11・案B）:
#
# | プロファイル  | 役割                       | 器の中身                    | 生き方              |
# |---------------|----------------------------|-----------------------------|---------------------|
# | `test`        | マージ前ゲートの検証       | sleep infinity（待つだけ）  | 検証が済めば畳む    |
# | `test-docker` | docker ドライバ自身の検証  | ホストで直接（器を作らない）| 検証が済めば畳む    |
# | `dev`         | PO がブラウザで触る面      | vite dev server（長命）     | 触り終わるまで残す  |
#
# 兼ねさせない理由は2つ。**検証は器の生死に左右されてはいけない**（dev server が落ちたことが
# テストの失敗に化ける）ことと、**人が触る環境は検証が終わっても残ってほしい**こと——
# 求める寿命が逆向きなので、ttl も公開の有無も1つの器では決められない。
#
# どちらも用意（`setup`）は provision の一部。プロファイル側で node_modules を自前で
# 用意する小細工は置かない——器が「用意が済んでいなくても自分でどうにかする」ようになると、
# 本体の順序が壊れても気づけない。
#
# **⚠ マージ順の縛り: この分離は task-0089 の後にしか入れられない。**
# 用意を `compose up` の前に済ませる直し（task-0089）は 2026-08-11 時点で未マージ
# （枝 `task/task-0089` にのみ在る）。本体は今も「compose up → healthcheck → setup」の順なので、
# **task-0089 より先にこの枝を入れると `dev` の provision が `vite: not found` で壊れる**
# （`test` は sleep infinity なので順序に依らず立つ）。
#
# 名前が `test` なのは `meta/config.yaml` の `verify.profile` の既定だから。
# 変えるならそちらにも書くこと。
profiles:
  # マージ前ゲートの検証専用（compose は docker/test.yaml）。人が触る面は持たない
  # ——ポートを開けないので決定59の「人が触る環境」にはならない。
  test:
    driver: docker
    config:
      compose: docker/test.yaml
    # 立てたあと一度だけ（task-0080）。node_modules は別の場所に隔離してあるので、
    # 立てただけでは中が空——ここで用意しないと検証コマンドが走らない
    #
    # **`--include=dev` は省かない**（2026-08-13 の事故）。このホストの常駐サービスは
    # NODE_ENV=production で動くので、それを継いだ子が素の `npm ci` を打つと npm は
    # devDependencies を落とす——**稼働中の作業ツリーから tsx / typescript が実際に消え**、
    # 職人の起動とサービスの再起動が両方止まった（下の test-docker が driver: process で
    # ホストの作業ツリーを直に触るため）。持ち込みは `driverSpawnEnv` で塞いだが、
    # 検証に要るものは検証の側でも名指ししておく——tsc も node --test も devDependency である
    setup: "npm ci --include=dev"
    # 環境より長生きする置き場（spec-environment §5.2）。**中身を決めるものを全部挙げる**
    # ——ロックだけだと、土台のイメージが変わったときに古いバイナリを掴む。
    # 鍵はドライバ名とプロファイル名も含めて作られる（pool.ts の resolveCache）ので、
    # **同じ材料でも test と dev の置き場は別物**。検証用の node_modules を、
    # 人が触る環境が書き換えることはない
    #
    # **compose ファイルも材料に入れる**（2026-08-15）。理由は2つ:
    # (a) node_modules の**置き場所を決めているのはこの compose ファイル**
    #     （どの小部屋をどこに載せるか）。配置が変われば置き場は別物でなければならない。
    # (b) 移行の事故を鍵で断つ。既に温まっている置き場は古い配置（ルート1本）のままなので、
    #     鍵が変わらないと**この直しを入れた瞬間に空の小部屋を掴んで全部落ちる**
    #     （`.banto-primed` が在るので `npm ci` は飛ばされる）。鍵が変われば
    #     新しい置き場は素＝印が無い＝用意し直しになる
    cache:
      key:  [package-lock.json, docker/Dockerfile.test, docker/test.yaml]
      path: /app/node_modules
    # マージ前ゲートは直列なので、居座らせない。検証が終われば畳まれる
    ttl: 45m
  # **docker ドライバ自身の受け入れテスト専用**（PO裁定 2026-08-12・案B+案D）。
  #
  # `test` の器（docker/test.yaml）には docker socket が無く、`docker compose` サブコマンドも
  # 入っていない。docker を叩く受け入れテストは I1 により skip せず**必ず落ちる**設計なので、
  # そのままだとゲートが中身と無関係に落ち続ける（実測: 7ファイル）。
  #
  # **socket を器に渡す道は採らない。** `/var/run/docker.sock` のマウントは、bind mount 付きの
  # コンテナを作れる＝ホスト root 相当の権限を器に渡すのと同じ。socket proxy で API を絞っても
  # コンテナ作成を許す時点で昇格経路は残るので、緩和にならない。特権コンテナ／DinD も、
  # docker ドライバがリポジトリを bind mount する以上、内側 daemon から見たパスがホストと
  # 一致せず配線し直しになる。
  #
  # **だから器を作らずホストで走らせる。** driver: process はホストでそのままコマンドを回すので、
  # socket を晒す先の器がそもそも無い。docker ドライバの受け入れテストは定義上ホストの docker を
  # 要する——器の中では原理的に検証できない類のもので、ここだけは冒頭の
  # 「Kobo は検証をホストで走らせない」の例外として PO が明示的に認めた。
  #
  # 回すのは `npm run test:docker`（対象7ファイルを package.json に列挙してある）。
  # `npm test` 側は同じ7ファイルを除外するので、**2つを足して初めて全部が回る**。
  # 片方に足し忘れると：新しい docker テストは `npm test` に残って器の中で落ちる（気づける）、
  # ファイル名を変えると `test:docker` が存在しないパスで落ちる（気づける）。
  # どちらの取りこぼしも黙って緑にはならない。
  test-docker:
    driver: process
    config:
      # 器を作らないので「立てる」対象が要らない。それでもドライバは常駐プロセスを求める
      # （provision は config.cmd 必須）ので、待つだけのものを置く——`test` の
      # sleep infinity と同じ理由で、**起動に何も要らない**ものにしてある。
      # config.port は持たせない＝決定59の「人が触る環境」にはならない。
      cmd: "sleep infinity"
    # ホストの作業ツリーに node_modules が無い状態（＝毎タスクの新しい worktree）でも回るように。
    # 既に実体のディレクトリが居るなら process ドライバは置き場を使わず触らない
    #
    # **ここが 2026-08-13 の事故の現場**。`driver: process` は器を作らずホストの作業ツリーで
    # そのまま `setup` を打つ。常駐サービスの NODE_ENV=production を継いだ `npm ci` が
    # devDependencies を落とし、**稼働中の本体ツリーから tsx / typescript が消えた**——
    # 検証が回らない・新しい職人が起こせない・再起動したら起動不能が同時に起きた。
    # 持ち込みは `driverSpawnEnv` で塞いだが、ここでも名指ししておく（設定だけ・機構だけの
    # どちらか片方に頼らない。この経路は本番の作業ツリーを直に触るのだから二重で守る）
    setup: "npm ci --include=dev"
    # 鍵に Dockerfile.test を挙げないのは、**この経路は器を作らない**から——中身を決めるのは
    # ロックだけ。置き場はドライバ名とプロファイル名込みの鍵で切られる（pool.ts の resolveCache）
    # ので、`test` の node_modules とは別物になる
    cache:
      key:  [package-lock.json]
      path: node_modules
    # docker の立ち上げ・片付けを実際に回すぶん `test` より時間を要る。それでも居座らせない
    ttl: 45m
  # PO がブラウザで触れるための開発画面プロファイル（2026-08-10 新設）。**検証には使わない**
  # ——ここで npm test を回すと、dev server の生死が検証結果に化ける（案B の分離の要点）。
  # config.port を持つので「人が触る」環境として扱われる（決定59）。
  # compose は docker/dev.yaml——vite dev server を**コンテナ内 4200** で立てる。
  #
  # **`config.port` はコンテナ側／アプリ側のポート**（番頭判断 2026-08-13）。ホスト側の
  # 番号はもう固定しない——compose は `- "4200"` とだけ書き、docker が空きを選び、
  # Environment Pool が `docker compose ps` で実際の publish 先を引いてそこへ中継する。
  # おかげで**判断待ちが2本並んでも、それぞれ別の環境の URL が出る**（以前は 4201 固定で、
  # 2本目が立たないか、2つの URL が同じ環境を指していた）。
  dev:
    driver: docker
    config:
      compose: docker/dev.yaml
      port: 4200
    # **長命の vite を起こす前に済む**（task-0089）。以前は compose up が先だったので
    # node_modules が空のまま vite が起きて即死し、compose 側で npm ci を前置きしていた
    #
    # `--include=dev` の理由は test プロファイルと同じ（2026-08-13 の事故）。vite は
    # devDependency なので、devDependencies が落ちればこの器は `vite: not found` で立たない
    setup: "npm ci --include=dev"
    # 土台（Dockerfile.test）は test と共用なので、鍵の材料も同じものを挙げる。
    # 置き場そのものはプロファイル名込みの鍵で別に切られる（test 側の注記のとおり）。
    # **compose ファイルを材料に入れる理由も test と同じ**（置き場の配置を決めているのは
    # docker/dev.yaml で、古い配置のまま温まっている置き場を掴ませない）
    cache:
      key:  [package-lock.json, docker/Dockerfile.test, docker/dev.yaml]
      path: /app/node_modules
    # レビューで触ってもらうための環境なので、十分な時間を残す（安全弁。使い終わったら畳む）
    ttl: 8h
