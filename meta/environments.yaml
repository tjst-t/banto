# banto 自身の環境プロファイル（Environment Pool の docker ドライバ用）。
#
# **Kobo は検証をホストで走らせない**（PO裁定 2026-08-07・task-0075）。受け持たせる
# リポジトリには必ず1つ要る——banto 自身も例外ではない（自分を受け持たせるのだから）。
#
# **検証用と実行環境用は別のプロファイルにする**（PO裁定 2026-08-11・案B）:
#
# | プロファイル | 役割                   | 器の中身                    | 生き方              |
# |--------------|------------------------|-----------------------------|---------------------|
# | `test`       | マージ前ゲートの検証   | sleep infinity（待つだけ）  | 検証が済めば畳む    |
# | `dev`        | PO がブラウザで触る面  | vite dev server（長命）     | 触り終わるまで残す  |
#
# 兼ねさせない理由は2つ。**検証は器の生死に左右されてはいけない**（dev server が落ちたことが
# テストの失敗に化ける）ことと、**人が触る環境は検証が終わっても残ってほしい**こと——
# 求める寿命が逆向きなので、ttl も公開の有無も1つの器では決められない。
#
# どちらも用意（`setup`）は provision の一部。プロファイル側で node_modules を自前で
# 用意する小細工は置かない——器が「用意が済んでいなくても自分でどうにかする」ようになると、
# 本体の順序が壊れても気づけない。
#
# **⚠ マージ順の縛り: この分離は task-0089 の後にしか入れられない。**
# 用意を `compose up` の前に済ませる直し（task-0089）は 2026-08-11 時点で未マージ
# （枝 `task/task-0089` にのみ在る）。本体は今も「compose up → healthcheck → setup」の順なので、
# **task-0089 より先にこの枝を入れると `dev` の provision が `vite: not found` で壊れる**
# （`test` は sleep infinity なので順序に依らず立つ）。
#
# 名前が `test` なのは `meta/config.yaml` の `verify.profile` の既定だから。
# 変えるならそちらにも書くこと。
profiles:
  # マージ前ゲートの検証専用（compose は docker/test.yaml）。人が触る面は持たない
  # ——ポートを開けないので決定59の「人が触る環境」にはならない。
  test:
    driver: docker
    config:
      compose: docker/test.yaml
    # 立てたあと一度だけ（task-0080）。node_modules は別の場所に隔離してあるので、
    # 立てただけでは中が空——ここで用意しないと検証コマンドが走らない
    setup: "npm ci"
    # 環境より長生きする置き場（spec-environment §5.2）。**中身を決めるものを全部挙げる**
    # ——ロックだけだと、土台のイメージが変わったときに古いバイナリを掴む。
    # 鍵はドライバ名とプロファイル名も含めて作られる（pool.ts の resolveCache）ので、
    # **同じ材料でも test と dev の置き場は別物**。検証用の node_modules を、
    # 人が触る環境が書き換えることはない
    cache:
      key:  [package-lock.json, docker/Dockerfile.test]
      path: /app/node_modules
    # マージ前ゲートは直列なので、居座らせない。検証が終われば畳まれる
    ttl: 45m
  # PO がブラウザで触れるための開発画面プロファイル（2026-08-10 新設）。**検証には使わない**
  # ——ここで npm test を回すと、dev server の生死が検証結果に化ける（案B の分離の要点）。
  # config.port を持つので「人が触る」環境として扱われる（決定59）。
  # compose は docker/dev.yaml——vite dev server をホスト 4201 で公開する。
  # （ホスト 4200 は opencode.service が占有。config.port は「ホスト側から見える
  #   ポート」なので 4201 を指す。proxy exposer は 127.0.0.1:config.port へ中継する）
  dev:
    driver: docker
    config:
      compose: docker/dev.yaml
      port: 4201
    # **長命の vite を起こす前に済む**（task-0089）。以前は compose up が先だったので
    # node_modules が空のまま vite が起きて即死し、compose 側で npm ci を前置きしていた
    setup: "npm ci"
    # 土台（Dockerfile.test）は test と共用なので、鍵の材料も同じものを挙げる。
    # 置き場そのものはプロファイル名込みの鍵で別に切られる（test 側の注記のとおり）
    cache:
      key:  [package-lock.json, docker/Dockerfile.test]
      path: /app/node_modules
    # レビューで触ってもらうための環境なので、十分な時間を残す（安全弁。使い終わったら畳む）
    ttl: 8h
