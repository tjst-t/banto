# banto 自身の検証環境プロファイル（Environment Pool の docker ドライバ用）。
#
# **Kobo は検証をホストで走らせない**（PO裁定 2026-08-07・task-0075）。受け持たせる
# リポジトリには必ず1つ要る——banto 自身も例外ではない（自分を受け持たせるのだから）。
#
# 名前が `test` なのは `meta/config.yaml` の `verify.profile` の既定だから。
# 変えるならそちらにも書くこと。
profiles:
  test:
    driver: docker
    config:
      compose: docker/test.yaml
    # 立てたあと一度だけ（task-0080）。node_modules は別の場所に隔離してあるので、
    # 立てただけでは中が空——ここで用意しないと検証コマンドが走らない
    setup: "npm ci"
    # 環境より長生きする置き場（spec-environment §5.2）。**中身を決めるものを全部挙げる**
    # ——ロックだけだと、土台のイメージが変わったときに古いバイナリを掴む
    cache:
      key:  [package-lock.json, docker/Dockerfile.test]
      path: /app/node_modules
    # マージ前ゲートは直列なので、居座らせない。検証が終われば畳まれる
    ttl: 45m
