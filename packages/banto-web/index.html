<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>banto — 番頭</title>
    <!--
      意匠の書体（spec-design §2.1）。D6: 外部依存を1つ増やすが、理由は
      「番頭の声＝明朝／道具＝角ゴシック／機械＝等幅」の書き分けが意匠の中身そのもので、
      端末に無い書体だと成り立たないため。読み込めなければトークンの後段（Hiragino 等）へ落ちる。

      **描画を待たせない読み方にしてある**（PO報告 2026-08-07）。
      素の `rel="stylesheet"` は**描画をブロックする**——日本語の書体3つ分の @font-face は
      885KB あり、Google Fonts への往復が遅い環境では**画面が出るまで丸ごと待たされる**。
      「繋がらなくても壊れない」つもりで書いてあったが、**繋がりが遅いときに壊れていた**
      （落ちるのは失敗したときだけで、遅いときは待つ）。

      `preload` で取りに行き、届いてから `stylesheet` に変える。初回描画は端末の書体で出て、
      届いた瞬間に意匠の書体へ入れ替わる（`display=swap` と同じ考え方を link にも適用する）。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=M+PLUS+1+Code:wght@400;500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=M+PLUS+1+Code:wght@400;500;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
